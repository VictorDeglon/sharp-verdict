# Builds the mod and runs the unit tests on every push to main and every pull request.

name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: summarise unit tests
        if: always()
        run: python3 tools/release/test-summary.py build/test-results/test --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: sharp-verdict-jar
          path: build/libs/
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    // Only needed for the unit test libraries. Loom adds the Minecraft and Fabric
    // repositories on its own.
    mavenCentral()
}

loom {
    // Keeps client-only code (rendering, input, HUD) in src/client and
    // environment-neutral code in src/main.
    splitEnvironmentSourceSets()

    mods {
        "sharp" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// A client game test that runs the real game on a virtual screen (gradle runClientGameTest): src/gametest.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'sharp-gametest'
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API: key mappings, level render events, HUD elements, lifecycle and connection events.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Minecraft ships Gson and Loom puts it on the compile classpath. Tests also need it at runtime for
    // the config tests, so it is declared explicitly here; the mod itself uses the game's copy.
    testImplementation "com.google.code.gson:gson:${project.gson_test_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = false
    }
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}
